{% extends 'base.html' %}

{% block title %}Payment Failed - Blinkit{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-16 text-center">
    <div class="bg-white rounded-3xl border border-gray-200 p-8 shadow-xl space-y-6">
        <div class="w-20 h-20 bg-red-100 text-red-600 rounded-full flex items-center justify-center text-4xl mx-auto shadow-inner">
            <i class="fa-solid fa-circle-xmark"></i>
        </div>

        <div class="space-y-2">
            <h2 class="text-3xl font-black text-gray-900">Payment Failed</h2>
            <p class="text-xs text-gray-500 font-medium">The transaction could not be completed or was cancelled.</p>
        </div>

        <div class="space-y-3 pt-2">
            {% if order %}
            <a href="{% url 'payment:order_payment' order.order_number %}" class="block w-full bg-[#0C831F] hover:bg-[#096e1a] text-white font-extrabold py-3.5 rounded-2xl transition shadow-lg text-sm">
                Retry Payment
            </a>
            {% else %}
            <a href="{% url 'payment:homepage' %}" class="block w-full bg-[#0C831F] hover:bg-[#096e1a] text-white font-extrabold py-3.5 rounded-2xl transition shadow-lg text-sm">
                Retry Payment
            </a>
            {% endif %}
            <a href="{% url 'cart:detail' %}" class="block w-full bg-gray-100 hover:bg-gray-200 text-gray-800 font-bold py-3 rounded-2xl transition text-xs">
                Back to Cart
            </a>
        </div>
    </div>
</div>
{% endblock %}
